<!doctype html><html><head><meta charset="utf-8"><title>harness10</title>
<style>body{margin:0;background:#222}iframe{border:0;width:440px;height:900px;background:#000;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
const log = [];
let scenario = {};
const F = document.getElementById("f");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const send = m => F.contentWindow.postMessage({ pluginMessage: m }, "*");
const W = () => F.contentWindow, D = () => F.contentDocument, Q = s => D().querySelector(s), QA = s => Array.from(D().querySelectorAll(s)), $ = id => D().getElementById(id);
const ev = code => F.contentWindow.eval(code);

window.addEventListener("message", (e) => {
  const m = e.data && e.data.pluginMessage; if (!m) return;
  log.push(m);
  const sc = scenario;
  if (m.type === "run-audit") {
    if (sc.auditCancelCheck) {
      const check2 = () => {
        if (log.some(x => x.type === "run-audit:cancel")) {
          send({ type: "audit-result", issues: [], summary: { total: 0, detached: 0, unstyledText: 0, rogueFills: 0, rogueStrokes: 0, ignored: 0, scannedElements: 2, elementsWithIssues: 0 }, canceled: true });
        } else {
          setTimeout(check2, 20);
        }
      };
      check2();
      return;
    }
    setTimeout(() => send({ type: "audit-result", issues: sc.issues || [], ignoredIssues: sc.ignoredIssues || [], summary: sc.summary || { total: (sc.issues||[]).length, scannedElements: 10, elementsWithIssues: (sc.issues||[]).length, ignored: (sc.ignoredIssues||[]).length } }), 20);
  } else if (m.type === "autofix:candidates") {
    const r = sc.candidates ? sc.candidates(m) : { candidates: [], recommendedId: null };
    setTimeout(() => send(Object.assign({ type: "autofix:candidates", key: m.key }, r)), 2);
  } else if (m.type === "issue:ignore") {
    setTimeout(() => send({ type: "issues:resolved", resolvedIds: [m.id], ignoredDelta: 1, issueType: m.issueType }), 2);
  } else if (m.type === "issue:unignore") {
    setTimeout(() => send({ type: "issue:unignored", id: m.id, issueType: m.issueType, ok: sc.unignoreOk !== false }), 2);
  } else if (m.type === "issue:unignoreAll") {
    setTimeout(() => send({ type: "audit-result", issues: sc.afterUnignore || [], ignoredIssues: [], summary: sc.afterUnignoreSummary || { total: 0, scannedElements: 10, elementsWithIssues: 0, ignored: 0 } }), 2);
  } else if (m.type === "select-nodes") {
    setTimeout(() => send({ type: "select-nodes:status", status: "done", count: m.ids.length }), 2);
  } else if (m.type === "get-saved-options") {
    setTimeout(() => send({ type: "saved-options", options: sc.savedOptions || null }), 2);
  } else if (m.type === "resize") {
    F.style.height = m.height + "px"; F.style.width = m.width + "px";
  }
});

async function load(file, sc) {
  log.length = 0; scenario = sc || {};
  await new Promise(res => { F.onload = res; F.src = (file || "../ui.html") + "?" + Date.now(); });
  // A hidden/covered window never fires requestAnimationFrame, which ui.html's render path waits on.
  // Timer-backed rAF keeps results deterministic either way and transitions/animations are disabled so style checks don't depend on paint timing.
  F.contentWindow.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
  const noMotion = F.contentDocument.createElement("style");
  noMotion.textContent = "*,*::before,*::after{transition:none !important;animation:none !important}";
  F.contentDocument.head.appendChild(noMotion);
  await sleep(150);
}
const proOn = async () => {}; // everything is free now; kept so older sections read the same
const scan = async (wait = 300) => { $("scanBtn").click(); await sleep(wait); };
const waitFor = async (fn, ms = 4000) => { const t = Date.now(); while (Date.now() - t < ms) { if (fn()) return true; await sleep(25); } return false; };
const sent = t => log.filter(m => m.type === t);
const mkIssue = (id, type, name) => ({ id, type, name: name || type, path: "Frame / " + (name || type) });
const rec = (id, name) => ({ candidates: [{ id: "V:" + id, name: name || "color/brand", displayName: "Colors / " + (name || "color/brand"), color: "rgba(1,2,3,1)", deltaE: 0.5, score: 3, source: "variable" }], recommendedId: "V:" + id, locked: false, debug: { libraryCollections: 0, libraryVariables: 0 } });

window.T = {};
const results = [];
const check = (name, cond, detail) => results.push({ name, pass: !!cond, detail: cond ? undefined : detail });
async function section(name, fn) {
  try { await fn(); } catch (e) { check("SECTION THREW: " + name, false, String(e && e.stack || e)); }
}

T.all = async function () {
  results.length = 0;

  await section("1. Multi-select filter chips", async () => {
    await load(); await proOn();
    scenario = { issues: [mkIssue("1:1","ROGUE_FILL"), mkIssue("1:2","ROGUE_STROKE"), mkIssue("1:3","UNSTYLED_TEXT")], candidates: (m) => rec(m.id) };
    await scan();
    $("filterFills").click(); await sleep(30);
    $("filterStrokes").click(); await sleep(30);
    check("Fills + Strokes can both be active", $("filterFills").dataset.active === "true" && $("filterStrokes").dataset.active === "true" && $("filterAll").dataset.active === "false", JSON.stringify({fills:$("filterFills").dataset.active, strokes:$("filterStrokes").dataset.active, all:$("filterAll").dataset.active}));
    check("aria-pressed matches dataset.active independently", $("filterFills").getAttribute("aria-pressed") === "true" && $("filterText").getAttribute("aria-pressed") === "false", "");
    check("list shows only the 2 active-type issues", D().querySelectorAll("#list .row").length === 2, "rows=" + D().querySelectorAll("#list .row").length);
    $("filterAll").click(); await sleep(30);
    check("clicking All clears the set", $("filterFills").dataset.active === "false" && $("filterAll").dataset.active === "true", "");
    check("All shows every issue again", D().querySelectorAll("#list .row").length === 3, "");
  });

  await section("2. Sort modes", async () => {
    await load(); await proOn();
    scenario = { issues: [mkIssue("2:1","ROGUE_FILL","Zebra"), mkIssue("2:2","DETACHED_INSTANCE","Apple"), mkIssue("2:3","UNSTYLED_TEXT","Mango")], candidates: (m) => rec(m.id) };
    await scan();
    const namesInOrder = () => QA("#list .row .name").map(n => n.textContent);
    check("default sort is scan order", JSON.stringify(namesInOrder()) === JSON.stringify(["Zebra","Apple","Mango"]), namesInOrder().join(","));
    $("sortBtn").click(); await sleep(30);
    check("sort menu opens", $("sortMenu").classList.contains("isOpen"), "");
    Q('.fixOption[data-sort="name"]').click(); await sleep(30);
    check("sort by name orders alphabetically", JSON.stringify(namesInOrder()) === JSON.stringify(["Apple","Mango","Zebra"]), namesInOrder().join(","));
    check("sort menu closes after picking", !$("sortMenu").classList.contains("isOpen"), "");
    $("sortBtn").click(); await sleep(30);
    Q('.fixOption[data-sort="type"]').click(); await sleep(30);
    check("sort by type groups DETACHED before TEXT before FILL", JSON.stringify(namesInOrder()) === JSON.stringify(["Apple","Mango","Zebra"]), namesInOrder().join(","));
  });

  await section("3. Candidate preview and per-row Fix (free for everyone)", async () => {
    await load();
    scenario = { issues: [mkIssue("3:1","ROGUE_FILL")], candidates: (m) => rec(m.id, "brand/primary") };
    await scan();
    await waitFor(() => sent("autofix:candidates").length >= 1);
    check("rows request candidates without any entitlement handshake", sent("autofix:candidates").length >= 1 && sent("pro:get-entitlements").length === 0, "");
    await sleep(150);
    const trig = Q('.fixTrigger[data-issue-key="3:1:fill"]');
    check("row shows the real candidate name", trig && /brand\/primary/.test(trig.textContent), trig && trig.textContent);
    check("candidate trigger is enabled", trig && trig.disabled === false, "");
    const fixBtn3 = Q('.fixBtn[data-issue-key="3:1:fill"]');
    check("Fix button is enabled once a candidate is selected", fixBtn3 && fixBtn3.disabled === false, "");
    fixBtn3.click();
    await waitFor(() => sent("autofix:apply").length >= 1);
    const apply = sent("autofix:apply")[0];
    check("clicking Fix sends autofix:apply with the recommended candidate", apply && apply.id === "3:1" && apply.candidateId === "V:3:1", JSON.stringify(apply));
    check("no purchase page is opened anywhere", sent("open-external").length === 0, "");
  });

  await section("4. Ignore-list", async () => {
    await load(); await proOn();
    // 4:1 carries BOTH a fill and a stroke issue; ignoring one must not hide the other.
    scenario = { issues: [mkIssue("4:1","ROGUE_FILL","Card"), mkIssue("4:1","ROGUE_STROKE","Card"), mkIssue("4:2","ROGUE_FILL","Other")], candidates: (m) => rec(m.id) };
    await scan();
    const rowCount = () => D().querySelectorAll("#list .row").length;
    check("3 issues rendered", rowCount() === 3, "rows=" + rowCount());
    const ignoreBtn = Q('.row[data-issue-id="4:1"] .ignoreBtn');
    check("ignore button exists on the row", !!ignoreBtn, "");
    ignoreBtn.click();
    await waitFor(() => rowCount() === 2);
    check("ignoring one issue removes only that issue (the node's other issue stays)", rowCount() === 2 && sent("issue:ignore").length === 1, "rows=" + rowCount());
    check("issue:ignore carries the issue type", sent("issue:ignore")[0].issueType === "ROGUE_FILL", JSON.stringify(sent("issue:ignore")[0]));
    check("'N ignored' toggle appears, panel starts collapsed", $("ignoredLink").style.display !== "none" && /^1 ignored$/.test($("ignoredLink").textContent) && $("ignoredPanel").hidden === true, $("ignoredLink").textContent);
    $("ignoredLink").click();
    await sleep(30);
    check("clicking the toggle opens the panel listing the ignored issue", $("ignoredPanel").hidden === false && D().querySelectorAll("#ignoredList .ignoredRow").length === 1 && /Card/.test($("ignoredList").textContent) && /Fill/.test($("ignoredList").textContent) && $("ignoredLink").getAttribute("aria-expanded") === "true", $("ignoredList").textContent);
    Q("#ignoredList .ignoredRestore").click();
    await waitFor(() => rowCount() === 3);
    check("Restore puts the issue back, hides toggle + panel, posts issue:unignore", rowCount() === 3 && sent("issue:unignore").length === 1 && $("ignoredLink").style.display === "none" && $("ignoredPanel").hidden === true, "rows=" + rowCount());
    check("stat cards reflect the restored issue (2 fills, 1 stroke)", $("statFills").textContent === "2" && $("statStrokes").textContent === "1", $("statFills").textContent + "/" + $("statStrokes").textContent);

    // Restore-all path: panel populated straight from the scan's ignoredIssues, then re-scan on restore all.
    scenario.ignoredIssues = [mkIssue("4:3","UNSTYLED_TEXT","Title"), mkIssue("4:4","ROGUE_STROKE","Divider")];
    scenario.afterUnignore = [mkIssue("4:3","UNSTYLED_TEXT","Title"), mkIssue("4:4","ROGUE_STROKE","Divider")];
    scenario.afterUnignoreSummary = { total: 2, unstyledText: 1, rogueStrokes: 1, scannedElements: 10, elementsWithIssues: 2, ignored: 0 };
    scenario.issues = [];
    await scan();
    check("scan result's ignoredIssues populate the toggle count", /^2 ignored$/.test($("ignoredLink").textContent), $("ignoredLink").textContent);
    $("ignoredLink").click();
    await sleep(30);
    check("panel lists both ignored issues", D().querySelectorAll("#ignoredList .ignoredRow").length === 2, "");
    $("ignoredRestoreAll").click();
    await waitFor(() => rowCount() === 2);
    check("Restore all re-scans and brings everything back", rowCount() === 2 && sent("issue:unignoreAll").length === 1 && $("ignoredLink").style.display === "none", "rows=" + rowCount());
  });

  await section("4b. Restore of a deleted layer", async () => {
    await load(); await proOn();
    scenario = { issues: [], ignoredIssues: [mkIssue("4b:1","ROGUE_FILL","Gone")], unignoreOk: false };
    await scan();
    $("ignoredLink").click();
    await sleep(30);
    Q("#ignoredList .ignoredRestore").click();
    await sleep(150);
    check("restoring a missing layer drops it from the panel without adding an issue", D().querySelectorAll("#list .row").length === 0 && $("ignoredLink").style.display === "none", "");
  });

  await section("5. Cancel a running scan", async () => {
    await load(); await proOn();
    scenario = { auditCancelCheck: true };
    $("scanBtn").click();
    await sleep(50);
    check("Cancel Scan button appears while scanning", W().getComputedStyle($("scanCancelBtn").closest(".loadingContent")).display !== "none", "");
    $("scanCancelBtn").click();
    await waitFor(() => sent("audit-result").some(r => r.canceled));
    check("run-audit:cancel is sent and a canceled audit-result is handled", sent("run-audit:cancel").length === 1, "");
    await sleep(150);
    check("status shows canceled, not completed", /canceled/i.test($("statusTitle").textContent), $("statusTitle").textContent);
    check("Scan button re-enabled after cancel", !$("scanBtn").disabled, "");
  });

  await section("6. Select N on canvas", async () => {
    await load(); await proOn();
    scenario = { issues: [mkIssue("6:1","ROGUE_FILL"), mkIssue("6:2","ROGUE_STROKE")], candidates: (m) => rec(m.id) };
    await scan();
    $("filterFills").click(); await sleep(30);
    $("selectAllBtn").click(); await sleep(30);
    const sel = sent("select-nodes")[0];
    check("select-all sends only the filtered ids", sel && JSON.stringify(sel.ids) === JSON.stringify(["6:1"]), sel && JSON.stringify(sel.ids));
  });

  await section("7. Export CSV", async () => {
    await load(); await proOn();
    scenario = { issues: [mkIssue("7:1","ROGUE_FILL","Card BG"), mkIssue("7:2","DETACHED_INSTANCE","Icon")], candidates: (m) => rec(m.id) };
    await scan();
    W().eval(`document.createElement = new Proxy(document.createElement.bind(document), { apply(target, thisArg, args) { const el = target(...args); if (args[0] === 'a') { window.__lastAnchor = el; el.click = () => { window.__anchorClicked = true; }; } return el; } });`);
    $("exportBtn").click();
    await sleep(50);
    const anchor = W().eval("window.__lastAnchor");
    check("export creates a download anchor with a CSV filename", anchor && /\.csv$/.test(anchor.download), anchor && anchor.download);
    check("export triggers the (stubbed) anchor click without a real download", W().eval("window.__anchorClicked") === true, "");
  });

  await section("8. Health Score tooltip", async () => {
    await load(); await proOn();
    scenario = { issues: [], summary: { total: 0, scannedElements: 5, elementsWithIssues: 0, ignored: 0 } };
    await scan();
    $("healthInfoBtn").focus();
    await sleep(400);
    const after = W().getComputedStyle(Q("#healthLabelWrap .tooltip")).opacity;
    check("health info tooltip becomes visible on focus", after === "1", "after=" + after);
    check("tooltip explains the formula", /audited elements/.test(Q("#healthLabelWrap .tooltip").textContent), Q("#healthLabelWrap .tooltip").textContent);
  });

  await section("9. Scanner options persistence", async () => {
    await load(undefined, { savedOptions: { scanChildren: false, checkRogueFills: true, checkRogueStrokes: false, checkDetached: true, checkTextStyles: false } });
    await sleep(200);
    check("saved options are applied to checkboxes on load", $("includeChildren").checked === false && $("rogueStrokes").checked === false && $("detachedInstances").checked === true, JSON.stringify({inc: $("includeChildren").checked, strokes: $("rogueStrokes").checked, det: $("detachedInstances").checked}));
    log.length = 0;
    $("rogueFills").checked = false;
    $("rogueFills").dispatchEvent(new Event("change", { bubbles: true }));
    await sleep(400);
    const saved = sent("options:save")[0];
    check("changing a checkbox sends options:save (debounced)", saved && saved.options.checkRogueFills === false, saved && JSON.stringify(saved.options));
  });

  await section("10. Regressions: collapse, sort menu, matching queue", async () => {
    await load(); await proOn();
    scenario = { issues: [mkIssue("10:1","ROGUE_FILL"), mkIssue("10:2","UNSTYLED_TEXT")], candidates: (m) => rec(m.id) };
    await scan(500);
    // sort menu must survive a window resize (the app's own figma.ui.resize() fires real resize events)
    $("sortBtn").click();
    await sleep(30);
    const opened = $("sortMenu").classList.contains("isOpen");
    W().dispatchEvent(new (W().Event)("resize"));
    await sleep(30);
    check("sort menu opens", opened, "");
    check("sort menu stays open across a resize event", $("sortMenu").classList.contains("isOpen"), "");
    $("sortBtn").click();
    // collapsing "Issues found" must collapse the toolbar with it
    Q('[data-toggle="secIssues"]').click();
    await sleep(100);
    check("collapsing Issues found hides the toolbar", W().getComputedStyle($("issuesToolbar")).visibility === "hidden" && $("secIssues").querySelector(".sectionBody").getBoundingClientRect().height === 0, "");
  });

  await section("11. Regression: stuck-importing rows must not starve the matching queue", async () => {
    await load(); await proOn();
    const issues = Array.from({ length: 60 }, (_, i) => mkIssue(String(i), "ROGUE_FILL", "Node " + i));
    scenario = { issues, candidates: (m) => Number(m.key.split(":")[0]) < 9
      ? { candidates: [], recommendedId: null, debug: { libraryCollections: 2, libraryVariables: 0, libraryImporting: true } }
      : rec(m.id) };
    await scan(300);
    // before the fix, the 9 stuck rows held every slot for ~30s and 0 other rows resolved
    const ok = await waitFor(() => ev('Object.keys(autofixState.candidatesByKey).filter(k => Number(k.split(":")[0]) >= 9).length') === 51, 20000);
    check("all non-stuck rows resolve while stuck rows are still retrying", ok, "resolved=" + ev('Object.keys(autofixState.candidatesByKey).length'));
  });

  return results;
};
</script></body></html>
